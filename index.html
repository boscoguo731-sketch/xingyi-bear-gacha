<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#120d1b" />
  <title>星懿熊·星光卡册</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #fff7e8; background: radial-gradient(circle at 22% 0%, #5c361b 0, transparent 28rem), radial-gradient(circle at 85% 20%, #302151 0, transparent 28rem), #120d1b; }
    button { font: inherit; }
    .app { width: min(100%, 980px); min-height: 100vh; margin: auto; padding: 20px clamp(16px, 4vw, 38px) 48px; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, #ffcf6b, #be6e24); box-shadow: 0 6px 24px #e98a2936; }
    .stash { display: flex; gap: 9px; padding: 8px 12px; border: 1px solid #f5c0673b; border-radius: 99px; background: #160f1bd4; color: #ffe2a5; font-size: .9rem; }
    .title-area { text-align: center; padding: 27px 0 12px; }
    .eyebrow { margin: 0 0 8px; color: #ffc95f; font-size: .78rem; font-weight: 800; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4.3rem); line-height: 1; letter-spacing: -.06em; text-shadow: 0 5px 32px #ef9d2a66; }
    .sub { margin: 13px 0 0; color: #d9c4b1; }
    .stage { position: relative; min-height: 380px; margin: 22px auto 18px; border: 1px solid #f7c66a4d; border-radius: 32px; overflow: hidden; background: #211522; box-shadow: 0 26px 70px #0008, inset 0 0 40px #f0a32d12; }
    .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #130b1459, transparent 48%, #100a18d9 100%); }
    .bear-art { width: 100%; height: 100%; min-height: 380px; object-fit: cover; object-position: center 42%; opacity: .88; transform: scale(1.03); }
    .stage-copy { position: absolute; z-index: 1; left: clamp(18px, 4vw, 36px); right: 18px; bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .stage-copy p { margin: 0 0 5px; color: #ffd57e; font-size: .8rem; font-weight: 800; letter-spacing: .12em; }
    .stage-copy h2 { margin: 0; font-size: clamp(1.4rem, 5vw, 2.2rem); }
    .pity { padding: 9px 12px; white-space: nowrap; border-radius: 14px; background: #120c16c9; border: 1px solid #ffd1724d; font-size: .78rem; color: #f4d8a5; }
    .draw-panel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; max-width: 650px; margin: 0 auto; }
    .draw-btn { min-height: 62px; border: 0; border-radius: 18px; cursor: pointer; color: #2c1606; font-weight: 900; transition: transform .18s ease, filter .18s ease; }
    .draw-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .draw-btn:active { transform: translateY(1px); }
    .draw-one { background: linear-gradient(135deg, #f8df98, #d78f32); box-shadow: 0 8px 25px #cd7b303d; }
    .draw-ten { background: linear-gradient(135deg, #c4b1ff, #8059d8); color: #fff; box-shadow: 0 8px 25px #8059d844; }
    .draw-panel .note { align-self: center; color: #a9969e; font-size: .74rem; text-align: center; }
    .quick { display: flex; justify-content: center; gap: 10px; margin: 18px 0 25px; }
    .ghost { border: 1px solid #f4c77540; background: #ffffff08; color: #ffe9bd; border-radius: 12px; padding: 10px 14px; cursor: pointer; }
    .hint { text-align: center; min-height: 1.5em; margin: 0; color: #cbb8ad; font-size: .85rem; }
    .cards-title { display: flex; align-items: end; justify-content: space-between; margin-top: 28px; }
    .cards-title h2 { margin: 0; font-size: 1.25rem; }
    .cards-title span { color: #a9959a; font-size: .8rem; }
    .collection { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 13px; }
    .mini-card { min-height: 136px; position: relative; display: flex; flex-direction: column; justify-content: end; padding: 11px; border-radius: 16px; overflow: hidden; border: 1px solid #ffffff14; background: linear-gradient(145deg, #37293c, #17101e); }
    .mini-card.locked { filter: saturate(.3); opacity: .55; }
    .mini-card .icon { position: absolute; top: 12px; right: 12px; font-size: 1.6rem; }
    .mini-card strong { font-size: .78rem; line-height: 1.2; }
    .mini-card small { margin-top: 4px; color: #d9b86b; font-size: .67rem; }
    .rarity-UR { background: linear-gradient(145deg, #f7b64e, #8d2f52 55%, #190f26); border-color: #ffe09b99; }
    .rarity-SSR { background: linear-gradient(145deg, #d8a7ff, #5a3fb8 55%, #17142d); border-color: #d9b2ff88; }
    .rarity-SR { background: linear-gradient(145deg, #75d8ef, #216294 55%, #101e2c); border-color: #98ecff80; }
    .rarity-R { background: linear-gradient(145deg, #b1e5a4, #437945 55%, #17241a); border-color: #b6f0a878; }
    .overlay { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: #08060dd9; backdrop-filter: blur(12px); }
    .overlay.show { display: flex; animation: fade .22s ease; }
    .reveal { width: min(88vw, 350px); aspect-ratio: .7; position: relative; display: flex; flex-direction: column; justify-content: end; padding: 25px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px #fff8, 0 35px 100px #000b; animation: rise .42s cubic-bezier(.2, .8, .2, 1); }
    .reveal::before { content: "✦"; position: absolute; inset: 15% 0 auto; text-align: center; font-size: 9rem; opacity: .22; }
    .reveal .rarity { position: relative; font-weight: 900; letter-spacing: .18em; font-size: .85rem; }
    .reveal h3 { position: relative; margin: 9px 0 2px; font-size: 2rem; }
    .reveal p { position: relative; margin: 0; color: #fff0ce; }
    .close-reveal { position: absolute; top: 12px; right: 12px; z-index: 2; border: 0; border-radius: 99px; width: 36px; height: 36px; cursor: pointer; background: #120d1b88; color: #fff; font-size: 1.2rem; }
    .result-row { position: fixed; z-index: 21; left: 50%; bottom: 24px; transform: translateX(-50%); display: none; width: min(94vw, 720px); gap: 8px; padding: 10px; border: 1px solid #ffffff22; border-radius: 17px; background: #16101be8; overflow-x: auto; }
    .result-row.show { display: flex; }
    .result-chip { min-width: 96px; padding: 8px; border-radius: 10px; font-size: .68rem; }
    .result-chip b { display: block; font-size: .74rem; margin-top: 4px; }
    @keyframes rise { from { opacity: 0; transform: scale(.72) rotate(-5deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 520px) { .app { padding-top: 14px; } .stage { min-height: 330px; border-radius: 25px; } .bear-art { min-height: 330px; } .draw-panel { grid-template-columns: 1fr 1fr; } .draw-panel .note { grid-column: 1 / -1; grid-row: 2; } .collection { grid-template-columns: repeat(2, 1fr); } .mini-card { min-height: 112px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>星懿熊</span></div>
      <div class="stash">✦ 星辉 <b id="stars">120</b></div>
    </header>
    <section class="title-area">
      <p class="eyebrow">XINGYI BEAR · STARLIGHT ARCHIVE</p>
      <h1>星光卡册</h1>
      <p class="sub">轻点一次，遇见今天的星懿熊。</p>
    </section>
    <section class="stage" aria-label="星懿熊抽卡区域">
      <img class="bear-art" src="xingyi-bear.png" alt="星懿熊手持发光卡牌" />
      <div class="stage-copy">
        <div><p>本期主题</p><h2>城市里的金色星光</h2></div>
        <div class="pity">UR 保底 · <b id="pity">0</b> / 80</div>
      </div>
    </section>
    <section class="draw-panel" aria-label="抽卡操作">
      <button class="draw-btn draw-one" id="drawOne">✦ 抽 1 次<br><small>消耗 1 星辉</small></button>
      <div class="note">所有卡牌仅保存在此设备<br>不涉及付费或真实奖励</div>
      <button class="draw-btn draw-ten" id="drawTen">✦ 连抽 10 次<br><small>消耗 10 星辉</small></button>
    </section>
    <div class="quick"><button class="ghost" id="openBook">查看我的卡册</button><button class="ghost" id="resetGame">重置试玩</button></div>
    <p class="hint" id="hint">首次登录赠送 120 星辉，开始收集吧。</p>
    <section aria-label="已发现卡牌">
      <div class="cards-title"><h2>已发现</h2><span id="collectionCount">0 / 8</span></div>
      <div class="collection" id="collection"></div>
    </section>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="抽卡结果">
    <article class="reveal" id="reveal"><button class="close-reveal" id="closeReveal" aria-label="关闭">×</button><div class="rarity" id="revealRarity"></div><h3 id="revealName"></h3><p id="revealText"></p></article>
  </div>
  <div class="result-row" id="resultRow" aria-label="十连抽结果"></div>
  <script>
    const cards = [
      { id: 'night', rarity: 'UR', icon: '🌠', name: '夜光队长', text: '把整座城市的星光装进口袋。', rate: 1 },
      { id: 'gold', rarity: 'SSR', icon: '✨', name: '金色巡游', text: '晚风、路灯与一张发亮的卡。', rate: 4 },
      { id: 'coffee', rarity: 'SSR', icon: '☕', name: '深夜咖啡师', text: '今晚的灵感，热腾腾地送达。', rate: 5 },
      { id: 'hood', rarity: 'SR', icon: '🖤', name: '黑衣小熊', text: '低调出场，也有自己的光。', rate: 12 },
      { id: 'metro', rarity: 'SR', icon: '🚇', name: '城市漫游', text: '下一站，去遇见新的故事。', rate: 14 },
      { id: 'plant', rarity: 'R', icon: '🌿', name: '窗边午后', text: '在小小绿意里，安心发呆。', rate: 21 },
      { id: 'toast', rarity: 'R', icon: '🥪', name: '元气早餐', text: '今天也要好好吃饭。', rate: 21 },
      { id: 'blanket', rarity: 'R', icon: '🧸', name: '软乎乎时刻', text: '把烦恼留在被子外面。', rate: 22 }
    ];
    const defaultState = { stars: 120, pity: 0, owned: {} };
    let state;
    try { state = { ...defaultState, ...JSON.parse(localStorage.getItem('xingyi-bear-gacha') || '{}') }; } catch { state = { ...defaultState }; }
    const el = (id) => document.getElementById(id);
    function save(){ localStorage.setItem('xingyi-bear-gacha', JSON.stringify(state)); }
    function cls(card){ return 'rarity-' + card.rarity; }
    function render(){
      el('stars').textContent = state.stars;
      el('pity').textContent = state.pity;
      el('collectionCount').textContent = Object.keys(state.owned).length + ' / ' + cards.length;
      el('collection').innerHTML = cards.map(c => `<article class="mini-card ${cls(c)} ${state.owned[c.id] ? '' : 'locked'}"><span class="icon">${state.owned[c.id] ? c.icon : '✦'}</span><strong>${state.owned[c.id] ? c.name : '未发现卡牌'}</strong><small>${state.owned[c.id] ? c.rarity + ' · 已获得 ' + state.owned[c.id] + ' 次' : '继续抽卡解锁'}</small></article>`).join('');
    }
    function choose(){
      if (state.pity >= 79) return cards[0];
      const roll = Math.random() * 100;
      let acc = 0;
      for (const card of cards) { acc += card.rate; if (roll < acc) return card; }
      return cards[cards.length - 1];
    }
    function showCard(card){
      const reveal = el('reveal');
      reveal.className = 'reveal ' + cls(card);
      el('revealRarity').textContent = card.rarity + ' · STARLIGHT CARD';
      el('revealName').textContent = card.name;
      el('revealText').textContent = card.text;
      el('overlay').classList.add('show');
    }
    function draw(times){
      if (state.stars < times) { el('hint').textContent = '星辉不足，点击“重置试玩”可以重新开始。'; return; }
      state.stars -= times;
      const result = [];
      for(let i = 0; i < times; i++){
        const card = choose(); result.push(card);
        state.owned[card.id] = (state.owned[card.id] || 0) + 1;
        state.pity = card.rarity === 'UR' ? 0 : state.pity + 1;
      }
      save(); render();
      const best = result.reduce((a,b) => cards.indexOf(a) < cards.indexOf(b) ? a : b);
      showCard(best);
      el('hint').textContent = times === 10 ? '十连完成：已收录 ' + result.length + ' 张星光卡。' : '已收录「' + best.name + '」。';
      if(times === 10){ el('resultRow').innerHTML = result.map(c => `<div class="result-chip ${cls(c)}">${c.rarity}<b>${c.icon} ${c.name}</b></div>`).join(''); el('resultRow').classList.add('show'); }
    }
    el('drawOne').onclick = () => draw(1);
    el('drawTen').onclick = () => draw(10);
    el('closeReveal').onclick = () => { el('overlay').classList.remove('show'); };
    el('overlay').onclick = (e) => { if(e.target === el('overlay')) el('overlay').classList.remove('show'); };
    el('openBook').onclick = () => { document.querySelector('.cards-title').scrollIntoView({ behavior: 'smooth' }); };
    el('resetGame').onclick = () => { state = { ...defaultState }; save(); render(); el('hint').textContent = '试玩进度已重置，120 星辉已回到口袋。'; el('resultRow').classList.remove('show'); };
    render();
  </script>
</body>
</html>
